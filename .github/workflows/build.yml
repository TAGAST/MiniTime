name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: build
  EXE_NAME: MiniTime.exe
  SIZE_LIMIT: 300000

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (git describe --tags --always --dirty) -replace '^v', ''
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version: $v"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} -G Ninja `
                -DCMAKE_BUILD_TYPE=Release `
                -DGAMECLOCK_VERSION=${{ steps.version.outputs.VERSION }}
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build
        shell: pwsh
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Size gate
        id: sizegate
        shell: pwsh
        run: |
          $exe = Join-Path "${{ env.BUILD_DIR }}" "${{ env.EXE_NAME }}"
          if (-not (Test-Path $exe)) { throw "artifact not found: $exe" }
          $size = (Get-Item $exe).Length
          $kb = [math]::Round($size / 1KB, 1)
          Write-Host ("artifact: {0:N0} bytes ({1} KB)" -f $size, $kb)
          "SIZE=$kb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($size -gt ${{ env.SIZE_LIMIT }}) {
            throw ("size gate failed: {0} bytes exceeds limit {1} bytes" -f $size, ${{ env.SIZE_LIMIT }})
          }
          Write-Host "size gate passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniTime-win64
          path: ${{ env.BUILD_DIR }}/${{ env.EXE_NAME }}
          if-no-files-found: error

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.BUILD_DIR }}/${{ env.EXE_NAME }}" `
                           -DestinationPath "MiniTime-${{ github.ref_name }}-win64.zip"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MiniTime-${{ github.ref_name }}-win64.zip
          generate_release_notes: true

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            '### MiniTime build',
            '',
            '| item | value |',
            '|---|---|',
            '| version | ${{ steps.version.outputs.VERSION }} |',
            '| size | ${{ steps.sizegate.outputs.SIZE }} KB |',
            '| size limit | 300 KB |',
            '| size gate | ${{ steps.sizegate.outcome }} |'
          )
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
