name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: build
  EXE_NAME: MiniTime.exe
  SIZE_LIMIT: 300000
  # 与本地开发所用的 llvm-mingw 版本保持一致
  LLVM_MINGW_VERSION: '20261020'
  LLVM_MINGW_ROOT: '${{ github.workspace }}\..\llvm-mingw'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = (git describe --tags --always --dirty) -replace '^v', ''
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version: $v"

      # 与本地构建保持一致：同一条 build.bat 链路，CI 验证的就是用户实际用的那条路
      - name: Setup llvm-mingw
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver  = "${{ env.LLVM_MINGW_VERSION }}"
          $root = [System.IO.Path]::GetFullPath("${{ env.LLVM_MINGW_ROOT }}")
          Write-Host "llvm-mingw 目标目录: $root"

          $gpp = Join-Path $root "bin\x86_64-w64-mingw32-g++.exe"
          Write-Host "期望编译器路径: $gpp"
          if (Test-Path $gpp) {
            Write-Host "已存在，跳过下载"
            exit 0
          }

          # 目标架构 i686 的包内置的编译器本身运行在 x64 上，可直接在 windows-latest 使用
          $asset = "llvm-mingw-$ver-msvcrt-i686.zip"
          $url   = "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$asset"
          $zip   = Join-Path $env:RUNNER_TEMP $asset
          Write-Host "下载: $url"
          curl.exe -L --fail --retry 5 --retry-delay 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "下载失败，curl 退出码 $LASTEXITCODE" }
          Write-Host "下载完成: $((Get-Item $zip).Length) 字节"

          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Expand-Archive -Path $zip -DestinationPath $root -Force
          Write-Host "解压完成，根目录内容："
          Get-ChildItem $root | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.Name)" }

          # 官方 zip 内层还有一层同名目录，需要找到真正的 bin 所在位置
          if (-not (Test-Path $gpp)) {
            $inner = Get-ChildItem $root -Directory -Filter 'llvm-mingw-*' | Select-Object -First 1
            if ($inner -and (Test-Path (Join-Path $inner.FullName "bin\x86_64-w64-mingw32-g++.exe"))) {
              Write-Host "检测到内层目录，路径调整为: $($inner.FullName)"
              "LLVM_ROOT=$($inner.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } else {
              throw "解压后未找到编译器: $gpp"
            }
          }

      - name: Build
        shell: pwsh
        run: |
          $root = $env:LLVM_ROOT
          if (-not $root) { $root = [System.IO.Path]::GetFullPath("${{ env.LLVM_MINGW_ROOT }}") }
          Write-Host "使用 llvm-mingw: $root"
          if (-not (Test-Path (Join-Path $root 'bin\x86_64-w64-mingw32-g++.exe'))) {
            throw "编译器不存在于: $root"
          }

          $env:MINGW = $root
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Size gate
        id: sizegate
        shell: pwsh
        run: |
          $exe = Join-Path "${{ env.BUILD_DIR }}" "${{ env.EXE_NAME }}"
          if (-not (Test-Path $exe)) { throw "artifact not found: $exe" }
          $size = (Get-Item $exe).Length
          $kb = [math]::Round($size / 1KB, 1)
          Write-Host ("artifact: {0:N0} bytes ({1} KB)" -f $size, $kb)
          "SIZE=$kb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($size -gt ${{ env.SIZE_LIMIT }}) {
            throw ("size gate failed: {0} bytes exceeds limit {1} bytes" -f $size, ${{ env.SIZE_LIMIT }})
          }
          Write-Host "size gate passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniTime-win64
          path: ${{ env.BUILD_DIR }}/${{ env.EXE_NAME }}
          if-no-files-found: error

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.BUILD_DIR }}/${{ env.EXE_NAME }}" `
                           -DestinationPath "MiniTime-${{ github.ref_name }}-win64.zip"

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MiniTime-${{ github.ref_name }}-win64.zip
          generate_release_notes: true

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $rows = @(
            '### MiniTime build',
            '',
            '| item | value |',
            '|---|---|',
            '| version | ${{ steps.version.outputs.VERSION }} |',
            '| size | ${{ steps.sizegate.outputs.SIZE }} KB |',
            '| size limit | 300 KB |',
            '| size gate | ${{ steps.sizegate.outcome }} |'
          )
          $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
